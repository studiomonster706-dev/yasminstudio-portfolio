<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yasmin | Welcome</title>

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }


        /* ================================
           INTRO
        ================================= */

        .intro {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }


        /* ================================
           VIDEO
        ================================= */

        .intro video {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* ================================
           ENTER BUTTON
        ================================= */

        .enter-button {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            display: inline-block;

            padding: 15px 42px;

            background: rgba(0, 0, 0, 0.65);

            border: 1px solid #ffffff;

            color: #ffffff;

            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 4px;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;
        }


        /* ================================
           BUTTON HOVER
        ================================= */

        .enter-button:hover {

            background: #ffffff;

            color: #000000;

            transform:
                translate(-50%, -50%)
                scale(1.05);
        }


        /* ================================
           BUTTON FOCUS
        ================================= */

        .enter-button:focus-visible {

            outline: 2px solid #ffffff;

            outline-offset: 5px;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .enter-button {

                padding: 13px 34px;

                font-size: 12px;

                letter-spacing: 3px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================
         INTRO
    ================================= -->

    <main class="intro">


        <!-- MP4 -->

        <video
            autoplay
            muted
            loop
            playsinline
        >

            <source
                src="images/Unnamed-compressed.mp4"
                type="video/mp4"
            >

        </video>


        <!-- ENTER BUTTON -->

        <a
            href="home.html"
            class="enter-button"
        >
            ENTER
        </a>


    </main>


</body>

</html>
